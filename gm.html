<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доброе утро, любовь моя 💌</title>
<style>
  :root{
    --pink-light:#ffe3ec;
    --pink-mid:#ffc9dd;
    --pink-line:#ffb3cf;
    --cream:#f6ead7;
    --cream-dark:#e9d9bd;
    --ink:#4a2e2e;
    --accent:#e8749a;
    --accent-soft:#f6a8c3;
    --white:#fffdfb;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:'Comic Sans MS','Segoe UI Rounded','Trebuchet MS',sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  body{
    background:
      repeating-linear-gradient(0deg, var(--pink-mid) 0 40px, var(--pink-light) 40px 80px),
      repeating-linear-gradient(90deg, var(--pink-mid) 0 40px, transparent 40px 80px);
    background-blend-mode:multiply;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .stage{
    width:100%;
    max-width:420px;
    height:100vh;
    max-height:820px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ---------- top caption ---------- */
  .caption{
    position:absolute;
    top:36px;
    left:0; right:0;
    text-align:center;
    font-weight:700;
    font-size:15px;
    line-height:1.4;
    padding:0 20px;
    text-shadow:0 1px 0 #fff, 0 0 6px rgba(255,255,255,.6);
    z-index:5;
  }

  /* ---------- SCENES ---------- */
  .scene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
  }
  .scene.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ---------- Envelope scene ---------- */
  .envelope-wrap{
    position:relative;
    width:300px;
    cursor:pointer;
    user-select:none;
  }
  .open-hint{
    text-align:center;
    font-weight:800;
    font-size:20px;
    color:var(--ink);
    margin-bottom:14px;
    animation:pulse 1.6s infinite ease-in-out;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }
  .envelope{
    position:relative;
    width:100%;
    aspect-ratio:1/0.72;
    filter:drop-shadow(0 12px 18px rgba(120,60,80,.28));
  }
  .env-body{
    position:absolute; inset:0;
    background:var(--cream);
    border-radius:8px;
  }
  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:60%;
    background:var(--cream-dark);
    clip-path:polygon(0 0,100% 0,50% 85%);
    transform-origin:top center;
    transition:transform .7s cubic-bezier(.6,-0.2,.3,1.4);
    z-index:3;
  }
  .envelope-wrap.opened .env-flap{
    transform:rotateX(180deg);
  }
  .env-shadow-fold{
    position:absolute; inset:0;
    background:linear-gradient(160deg, transparent 45%, rgba(0,0,0,.06) 50%, transparent 55%),
               linear-gradient(20deg, transparent 45%, rgba(0,0,0,.06) 50%, transparent 55%);
    pointer-events:none;
    z-index:2;
  }
  .seal{
    position:absolute;
    top:44%; left:50%;
    transform:translate(-50%,-50%);
    width:64px; height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent-soft), var(--accent) 70%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 6px rgba(0,0,0,.25) inset, 0 4px 8px rgba(0,0,0,.25);
    z-index:4;
    transition:opacity .3s ease, transform .3s ease;
    font-size:26px;
  }
  .envelope-wrap.opened .seal{
    opacity:0;
    transform:translate(-50%,-50%) scale(.4);
  }
  .env-labels{
    position:absolute;
    left:22px; bottom:20px;
    font-size:13px;
    line-height:1.5;
    color:var(--ink);
    font-family:'Segoe Script','Brush Script MT',cursive;
    font-weight:700;
  }
  .env-arrow{
    position:absolute;
    top:-46px; right:18px;
    width:60px; height:60px;
    opacity:.85;
  }
  .peek-cat{
    position:absolute;
    left:-64px;
    top:52%;
    width:100px;
    transform:translateY(-50%);
    animation:peek 2.6s infinite ease-in-out;
    z-index:1;
  }
  @keyframes peek{
    0%,100%{ transform:translateY(-50%) translateX(0); }
    50%{ transform:translateY(-50%) translateX(10px); }
  }

  /* ---------- Letter scene ---------- */
  .letter-card{
    background:var(--white);
    width:100%;
    max-width:320px;
    border-radius:6px;
    padding:26px 22px 30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(120,60,80,.25);
    transform:rotate(-1deg);
    position:relative;
    overflow:visible;
  }
  .letter-sun{
    position:absolute;
    top:-26px; right:-22px;
    width:64px;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));
  }
  .letter-cloud{
    position:absolute;
    bottom:-18px; left:-26px;
    width:56px;
    opacity:.9;
  }
  .torn-edge{
    height:14px;
    background:
      linear-gradient(135deg, transparent 50%, var(--white) 50%) 0 0/10px 14px repeat-x,
      linear-gradient(-135deg, transparent 50%, var(--white) 50%) 0 0/10px 14px repeat-x;
    margin:-26px -22px 18px;
  }
  .letter-title{
    font-size:23px;
    font-weight:800;
    margin:6px 0 4px;
  }
  .heart-pop{
    font-size:22px;
    animation:heartbeat 1.1s infinite ease-in-out;
    display:inline-block;
    margin:2px 0 10px;
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25);}
  }
  .bears{
    margin:10px 0 18px;
    display:flex;
    justify-content:center;
  }
  .bears svg{ width:180px; }
  .btn{
    border:none;
    border-radius:24px;
    padding:14px 30px;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    background:var(--cream);
    color:var(--ink);
    box-shadow:0 4px 0 var(--cream-dark);
    transition:transform .15s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cream-dark);}
  .btn.primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 4px 0 #c85c80;
  }
  .btn.primary:active{box-shadow:0 1px 0 #c85c80;}

  /* ---------- Question scene ---------- */
  .question-card{
    text-align:center;
    width:100%;
  }
  .question-title{
    font-size:22px;
    font-weight:800;
    margin-bottom:18px;
    text-shadow:0 1px 0 #fff;
  }
  .q-face{
    font-size:90px;
    margin-bottom:22px;
    animation:float 2.4s infinite ease-in-out;
  }
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }
  .q-buttons{
    display:flex;
    gap:16px;
    justify-content:center;
    position:relative;
    height:56px;
  }
  .q-buttons .btn{
    min-width:100px;
  }
  #noBtn{
    position:relative;
    transition:transform .18s ease;
  }

  /* ---------- Final scene ---------- */
  .final-card{
    text-align:center;
    max-width:320px;
  }
  .final-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:10px;
  }
  .final-msg{
    font-size:15px;
    line-height:1.6;
    background:var(--white);
    border-radius:14px;
    padding:18px 20px;
    box-shadow:0 8px 20px rgba(120,60,80,.22);
    margin-bottom:14px;
  }
  .final-emoji{font-size:50px;margin-bottom:8px;display:block;}
  .restart{
    font-size:13px;
    text-decoration:underline;
    color:var(--accent);
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="caption" id="caption">Сегодня будет много чаевых и зарплата уроо</div>

  <!-- Scene 1: Envelope -->
  <div class="scene active" id="scene-envelope">
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="open-hint">Нажми, чтобы открыть</div>
      <div class="envelope">
        <svg class="env-arrow" viewBox="0 0 60 60" fill="none">
          <path d="M10 5 C35 5, 45 20, 30 30 C18 38, 30 48, 45 45" stroke="#7a5a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M38 40 L45 45 L47 37" stroke="#7a5a4a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <!-- ============ PEEKING CAT (same head template as sleepy cat) ============ -->
        <svg class="peek-cat" viewBox="0 0 150 150" fill="none">
          <path d="M32 52 L14 14 L58 36 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M34 48 L23 24 L50 37 Z" fill="#ffc2d1"/>
          <path d="M118 52 L136 14 L92 36 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M116 48 L127 24 L100 37 Z" fill="#ffc2d1"/>
          <path d="M26 78 C20 48 44 30 75 30 C106 30 130 48 124 78 C120 106 100 128 75 128 C50 128 30 106 26 78 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M52 76 C56 70 64 70 68 76" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="94" cy="76" r="4.5" fill="#2b2b2b"/>
          <path d="M78 90 Q82 94 86 90" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="48" cy="96" r="8" fill="#ffc2d1" opacity=".85"/>
          <circle cx="102" cy="94" r="8" fill="#ffc2d1" opacity=".85"/>
          <path d="M4 82 L34 84 M4 92 L34 90" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
        </svg>

        <div class="env-body"></div>
        <div class="env-labels">От кого: Зема<br>Кому: Доня</div>
        <div class="seal">🎀</div>
        <div class="env-flap"></div>
        <div class="env-shadow-fold"></div>
      </div>
    </div>
  </div>

  <!-- Scene 2: Letter -->
  <div class="scene" id="scene-letter">
    <div class="letter-card">
      <svg class="letter-sun" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="14" fill="#ffd23f" stroke="#e8a800" stroke-width="2"/>
        <g stroke="#ffd23f" stroke-width="4" stroke-linecap="round">
          <path d="M32 4 L32 12"/>
          <path d="M32 52 L32 60"/>
          <path d="M4 32 L12 32"/>
          <path d="M52 32 L60 32"/>
          <path d="M11 11 L17 17"/>
          <path d="M47 47 L53 53"/>
          <path d="M11 53 L17 47"/>
          <path d="M47 17 L53 11"/>
        </g>
      </svg>
      <svg class="letter-cloud" viewBox="0 0 60 36" fill="none">
        <ellipse cx="20" cy="22" rx="18" ry="12" fill="#e9e9ec"/>
        <ellipse cx="36" cy="16" rx="14" ry="14" fill="#f2f2f5"/>
        <ellipse cx="46" cy="24" rx="12" ry="9" fill="#e9e9ec"/>
      </svg>
      <div class="torn-edge"></div>
      <div class="letter-title">Доброе утро, любовь моя! ☀️</div>
      <div class="heart-pop">💗</div>

      <!-- ============ CUDDLING CATS (same head template as sleepy cat, two instances) ============ -->
      <div class="bears">
        <svg viewBox="0 0 260 160" fill="none">
          <!-- back cat (right) - same template, translated -->
          <g transform="translate(118,10) scale(0.82)">
            <path d="M32 52 L14 14 L58 36 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
            <path d="M34 48 L23 24 L50 37 Z" fill="#ffc2d1"/>
            <path d="M118 52 L136 14 L92 36 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
            <path d="M116 48 L127 24 L100 37 Z" fill="#ffc2d1"/>
            <path d="M26 78 C20 48 44 30 75 30 C106 30 130 48 124 78 C120 106 100 128 75 128 C50 128 30 106 26 78 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="66" cy="76" r="4.5" fill="#2b2b2b"/>
            <circle cx="94" cy="76" r="4.5" fill="#2b2b2b"/>
            <path d="M78 90 Q82 94 86 90" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="48" cy="96" r="8" fill="#ffc2d1" opacity=".85"/>
            <circle cx="102" cy="94" r="8" fill="#ffc2d1" opacity=".85"/>
          </g>
          <!-- front cat (left) - same template, translated, drawn on top -->
          <g transform="translate(0,4) scale(0.92)">
            <path d="M32 52 L14 14 L58 36 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
            <path d="M34 48 L23 24 L50 37 Z" fill="#ffc2d1"/>
            <path d="M118 52 L136 14 L92 36 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
            <path d="M116 48 L127 24 L100 37 Z" fill="#ffc2d1"/>
            <path d="M26 78 C20 48 44 30 75 30 C106 30 130 48 124 78 C120 106 100 128 75 128 C50 128 30 106 26 78 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
            <path d="M52 76 C56 70 64 70 68 76" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M82 76 C86 70 94 70 98 76" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M70 90 Q75 95 80 90" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="46" cy="98" r="8" fill="#ffc2d1" opacity=".85"/>
            <circle cx="104" cy="98" r="8" fill="#ffc2d1" opacity=".85"/>
            <path d="M4 82 L34 84 M4 92 L34 90" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <button class="btn primary" id="helloBtn">Доброе утро</button>
    </div>
  </div>

  <!-- Scene 3: Question -->
  <div class="scene" id="scene-question">
    <div class="question-card">
      <div class="question-title">Ты хорошо поспала?</div>

      <!-- ============ SLEEPY CAT FACE (redesigned) ============ -->
      <div class="q-face">
        <svg viewBox="0 0 150 150" fill="none" style="width:130px;">
          <!-- ears -->
          <path d="M32 52 L14 14 L58 36 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M34 48 L23 24 L50 37 Z" fill="#ffc2d1"/>
          <path d="M118 52 L136 14 L92 36 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M116 48 L127 24 L100 37 Z" fill="#ffc2d1"/>
          <!-- head -->
          <path d="M26 78 C20 48 44 30 75 30 C106 30 130 48 124 78 C120 106 100 128 75 128 C50 128 30 106 26 78 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <!-- sleepy closed eyes -->
          <path d="M46 76 C50 70 58 70 62 76" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M88 76 C92 70 100 70 104 76" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- nose + mouth -->
          <path d="M72 88 L78 88 L75 92 Z" fill="#e8749a"/>
          <path d="M75 92 L75 96 M75 96 C71 100 66 99 64 96 M75 96 C79 100 84 99 86 96" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- blush -->
          <circle cx="42" cy="94" r="9" fill="#ffc2d1" opacity=".85"/>
          <circle cx="108" cy="94" r="9" fill="#ffc2d1" opacity=".85"/>
          <!-- whiskers -->
          <path d="M4 82 L34 84 M4 92 L34 90" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M146 82 L116 84 M146 92 L116 90" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
          <!-- zzz -->
          <text x="112" y="24" font-family="Comic Sans MS, sans-serif" font-size="16" font-weight="700" fill="#c8a8e0">z</text>
          <text x="122" y="14" font-family="Comic Sans MS, sans-serif" font-size="12" font-weight="700" fill="#c8a8e0">z</text>
        </svg>
      </div>

      <div class="q-buttons">
        <button class="btn primary" id="yesBtn">ДА</button>
        <button class="btn" id="noBtn">НЕТ</button>
      </div>
    </div>
  </div>

  <!-- Scene 4: Final -->
  <div class="scene" id="scene-final">
    <div class="final-card">
      <span class="final-emoji">💌</span>
      <div class="final-title">Хорошего дня!</div>
      <div class="final-msg" id="finalMsg">Пусть сегодняшний день будет таким же светлым, как твоя улыбка. Люблю тебя</div>
      <button class="restart" id="restartBtn">Открыть письмо ещё раз</button>
    </div>
  </div>

</div>

<script>
  const captions = {
    envelope: 'конечно... получить сообщение "доброе утро" — это мило, но вот это:',
    letter: 'Всегда рядом поддержу в любой момент',
    question: 'Самая добрая красивая моя любимая',
    final: 'Я щас сплю'
  };
  const caption = document.getElementById('caption');
  const scenes = {
    envelope: document.getElementById('scene-envelope'),
    letter: document.getElementById('scene-letter'),
    question: document.getElementById('scene-question'),
    final: document.getElementById('scene-final'),
  };

  function goTo(name){
    Object.values(scenes).forEach(s=>s.classList.remove('active'));
    scenes[name].classList.add('active');
    caption.textContent = captions[name];
  }

  document.getElementById('envelopeWrap').addEventListener('click', function(){
    this.classList.add('opened');
    setTimeout(()=>goTo('letter'), 650);
  });

  document.getElementById('helloBtn').addEventListener('click', ()=>goTo('question'));

  document.getElementById('yesBtn').addEventListener('click', ()=>{
    document.getElementById('finalMsg').textContent = 'Ура я рад,Удачи на смене сил и терпения Любовь моя 💛';
    goTo('final');
  });

  // playful dodging "NO" button
  const noBtn = document.getElementById('noBtn');
  const qButtons = document.querySelector('.q-buttons');
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    dodge();
  });
  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    dodge();
  }, {passive:false});

  function dodge(){
    const rect = qButtons.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const maxX = rect.width - btnRect.width - 20;
    const maxY = 8;
    const randX = (Math.random()-0.5) * maxX;
    const randY = (Math.random()-0.5) * maxY * 2;
    noBtn.style.transform = `translate(${randX}px, ${randY}px)`;
  }

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    document.getElementById('envelopeWrap').classList.remove('opened');
    noBtn.style.transform = 'none';
    goTo('envelope');
  });
</script>

</body>
</html>
