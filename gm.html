<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доброе утро, любовь моя 💌</title>
<style>
  :root{
    --pink-light:#ffe3ec;
    --pink-mid:#ffc9dd;
    --pink-line:#ffb3cf;
    --cream:#f6ead7;
    --cream-dark:#e9d9bd;
    --ink:#4a2e2e;
    --accent:#e8749a;
    --accent-soft:#f6a8c3;
    --white:#fffdfb;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:'Comic Sans MS','Segoe UI Rounded','Trebuchet MS',sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  body{
    background:
      repeating-linear-gradient(0deg, var(--pink-mid) 0 40px, var(--pink-light) 40px 80px),
      repeating-linear-gradient(90deg, var(--pink-mid) 0 40px, transparent 40px 80px);
    background-blend-mode:multiply;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .stage{
    width:100%;
    max-width:420px;
    height:100vh;
    max-height:820px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ---------- top caption ---------- */
  .caption{
    position:absolute;
    top:36px;
    left:0; right:0;
    text-align:center;
    font-weight:700;
    font-size:15px;
    line-height:1.4;
    padding:0 20px;
    text-shadow:0 1px 0 #fff, 0 0 6px rgba(255,255,255,.6);
    z-index:5;
  }

  /* ---------- SCENES ---------- */
  .scene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
  }
  .scene.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ---------- Envelope scene ---------- */
  .envelope-wrap{
    position:relative;
    width:300px;
    cursor:pointer;
    user-select:none;
  }
  .open-hint{
    text-align:center;
    font-weight:800;
    font-size:20px;
    color:var(--ink);
    margin-bottom:14px;
    animation:pulse 1.6s infinite ease-in-out;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }
  .envelope{
    position:relative;
    width:100%;
    aspect-ratio:1/0.72;
    filter:drop-shadow(0 12px 18px rgba(120,60,80,.28));
  }
  .env-body{
    position:absolute; inset:0;
    background:var(--cream);
    border-radius:8px;
  }
  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:60%;
    background:var(--cream-dark);
    clip-path:polygon(0 0,100% 0,50% 85%);
    transform-origin:top center;
    transition:transform .7s cubic-bezier(.6,-0.2,.3,1.4);
    z-index:3;
  }
  .envelope-wrap.opened .env-flap{
    transform:rotateX(180deg);
  }
  .env-shadow-fold{
    position:absolute; inset:0;
    background:linear-gradient(160deg, transparent 45%, rgba(0,0,0,.06) 50%, transparent 55%),
               linear-gradient(20deg, transparent 45%, rgba(0,0,0,.06) 50%, transparent 55%);
    pointer-events:none;
    z-index:2;
  }
  .seal{
    position:absolute;
    top:44%; left:50%;
    transform:translate(-50%,-50%);
    width:64px; height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent-soft), var(--accent) 70%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 6px rgba(0,0,0,.25) inset, 0 4px 8px rgba(0,0,0,.25);
    z-index:4;
    transition:opacity .3s ease, transform .3s ease;
    font-size:26px;
  }
  .envelope-wrap.opened .seal{
    opacity:0;
    transform:translate(-50%,-50%) scale(.4);
  }
  .env-labels{
    position:absolute;
    left:22px; bottom:20px;
    font-size:13px;
    line-height:1.5;
    color:var(--ink);
    font-family:'Segoe Script','Brush Script MT',cursive;
    font-weight:700;
  }
  .env-arrow{
    position:absolute;
    top:-46px; right:18px;
    width:60px; height:60px;
    opacity:.85;
  }
  .peek-cat{
    position:absolute;
    left:-58px;
    top:50%;
    width:90px;
    transform:translateY(-50%);
    animation:peek 2.6s infinite ease-in-out;
    z-index:1;
  }
  @keyframes peek{
    0%,100%{ transform:translateY(-50%) translateX(0); }
    50%{ transform:translateY(-50%) translateX(10px); }
  }

  /* ---------- Letter scene ---------- */
  .letter-card{
    background:var(--white);
    width:100%;
    max-width:320px;
    border-radius:6px;
    padding:26px 22px 30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(120,60,80,.25);
    transform:rotate(-1deg);
    position:relative;
    overflow:visible;
  }
  .letter-sun{
    position:absolute;
    top:-26px; right:-22px;
    width:64px;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));
  }
  .letter-cloud{
    position:absolute;
    bottom:-18px; left:-26px;
    width:56px;
    opacity:.9;
  }
  .torn-edge{
    height:14px;
    background:
      linear-gradient(135deg, transparent 50%, var(--white) 50%) 0 0/10px 14px repeat-x,
      linear-gradient(-135deg, transparent 50%, var(--white) 50%) 0 0/10px 14px repeat-x;
    margin:-26px -22px 18px;
  }
  .letter-title{
    font-size:23px;
    font-weight:800;
    margin:6px 0 4px;
  }
  .heart-pop{
    font-size:22px;
    animation:heartbeat 1.1s infinite ease-in-out;
    display:inline-block;
    margin:2px 0 10px;
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25);}
  }
  .bears{
    margin:10px 0 18px;
    display:flex;
    justify-content:center;
  }
  .bears svg{ width:170px; }
  .btn{
    border:none;
    border-radius:24px;
    padding:14px 30px;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    background:var(--cream);
    color:var(--ink);
    box-shadow:0 4px 0 var(--cream-dark);
    transition:transform .15s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cream-dark);}
  .btn.primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 4px 0 #c85c80;
  }
  .btn.primary:active{box-shadow:0 1px 0 #c85c80;}

  /* ---------- Question scene ---------- */
  .question-card{
    text-align:center;
    width:100%;
  }
  .question-title{
    font-size:22px;
    font-weight:800;
    margin-bottom:18px;
    text-shadow:0 1px 0 #fff;
  }
  .q-face{
    font-size:90px;
    margin-bottom:22px;
    animation:float 2.4s infinite ease-in-out;
  }
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }
  .q-buttons{
    display:flex;
    gap:16px;
    justify-content:center;
    position:relative;
    height:56px;
  }
  .q-buttons .btn{
    min-width:100px;
  }
  #noBtn{
    position:relative;
    transition:transform .18s ease;
  }

  /* ---------- Final scene ---------- */
  .final-card{
    text-align:center;
    max-width:320px;
  }
  .final-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:10px;
  }
  .final-msg{
    font-size:15px;
    line-height:1.6;
    background:var(--white);
    border-radius:14px;
    padding:18px 20px;
    box-shadow:0 8px 20px rgba(120,60,80,.22);
    margin-bottom:14px;
  }
  .final-emoji{font-size:50px;margin-bottom:8px;display:block;}
  .restart{
    font-size:13px;
    text-decoration:underline;
    color:var(--accent);
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="caption" id="caption">Сегодня будет много чаевых и зарплата уроо</div>

  <!-- Scene 1: Envelope -->
  <div class="scene active" id="scene-envelope">
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="open-hint">Нажми, чтобы открыть</div>
      <div class="envelope">
        <svg class="env-arrow" viewBox="0 0 60 60" fill="none">
          <path d="M10 5 C35 5, 45 20, 30 30 C18 38, 30 48, 45 45" stroke="#7a5a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M38 40 L45 45 L47 37" stroke="#7a5a4a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="peek-cat" viewBox="0 0 120 110" fill="none">
          <path d="M18 78 C10 55 14 30 34 18 C40 10 46 8 50 14 C54 8 62 9 66 16 C86 26 92 52 84 76 C80 92 26 94 18 78 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="46" cy="56" r="4.5" fill="#2b2b2b"/>
          <path d="M78 50 C82 52 82 58 78 60" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="40" cy="68" r="6" fill="#ffc2d1" opacity=".8"/>
          <path d="M8 60 L26 62 M8 68 L26 66" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="env-body"></div>
        <div class="env-labels">От кого: Зема<br>Кому: Доня</div>
        <div class="seal">🎀</div>
        <div class="env-flap"></div>
        <div class="env-shadow-fold"></div>
      </div>
    </div>
  </div>

  <!-- Scene 2: Letter -->
  <div class="scene" id="scene-letter">
    <div class="letter-card">
      <svg class="letter-sun" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="14" fill="#ffd23f" stroke="#e8a800" stroke-width="2"/>
        <g stroke="#ffd23f" stroke-width="4" stroke-linecap="round">
          <path d="M32 4 L32 12"/>
          <path d="M32 52 L32 60"/>
          <path d="M4 32 L12 32"/>
          <path d="M52 32 L60 32"/>
          <path d="M11 11 L17 17"/>
          <path d="M47 47 L53 53"/>
          <path d="M11 53 L17 47"/>
          <path d="M47 17 L53 11"/>
        </g>
      </svg>
      <svg class="letter-cloud" viewBox="0 0 60 36" fill="none">
        <ellipse cx="20" cy="22" rx="18" ry="12" fill="#e9e9ec"/>
        <ellipse cx="36" cy="16" rx="14" ry="14" fill="#f2f2f5"/>
        <ellipse cx="46" cy="24" rx="12" ry="9" fill="#e9e9ec"/>
      </svg>
      <div class="torn-edge"></div>
      <div class="letter-title">Доброе утро, любовь моя! ☀️</div>
      <div class="heart-pop">💗</div>
      <div class="bears">
        <svg viewBox="0 0 220 140" fill="none">
          <!-- back cat (right, darker ear tip) -->
          <path d="M158 128 C124 134 96 114 96 84 C90 66 98 48 116 40 C120 30 130 28 134 36 C138 28 148 30 152 38 C172 46 180 68 174 90 C174 112 190 128 158 128 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M132 34 C128 24 138 20 144 28 Z" fill="#2b2b2b"/>
          <circle cx="128" cy="76" r="4.5" fill="#2b2b2b"/>
          <path d="M156 70 C160 72 160 78 156 80" stroke="#2b2b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <circle cx="120" cy="90" r="7" fill="#ffc2d1" opacity=".85"/>
          <path d="M96 84 C88 82 88 90 96 92" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- front cat (left) -->
          <path d="M92 132 C56 136 28 114 30 82 C24 62 34 42 54 34 C58 22 70 20 74 30 C78 20 90 22 94 32 C116 40 122 64 114 88 C114 114 128 132 92 132 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M50 76 C48 74 48 80 50 82" stroke="#2b2b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M78 74 C80 72 80 78 78 80" stroke="#2b2b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <circle cx="44" cy="92" r="7" fill="#ffc2d1" opacity=".85"/>
          <circle cx="84" cy="92" r="7" fill="#ffc2d1" opacity=".85"/>
          <path d="M4 84 L30 86 M4 92 L30 90" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <button class="btn primary" id="helloBtn">Доброе утро</button>
    </div>
  </div>

  <!-- Scene 3: Question -->
  <div class="scene" id="scene-question">
    <div class="question-card">
      <div class="question-title">Ты хорошо поспала?</div>
      <div class="q-face">
        <svg viewBox="0 0 140 130" fill="none" style="width:120px;">
          <path d="M70 122 C36 122 14 100 16 74 C10 56 18 38 36 30 C40 20 50 18 54 26 C58 16 68 18 72 26 C76 18 86 16 90 26 C94 18 104 20 108 30 C126 38 134 56 128 74 C130 100 104 122 70 122 Z" fill="#fff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
          <path d="M40 30 L34 12 M54 26 L52 8 M86 26 L88 8 M100 30 L106 12" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M46 68 C50 62 56 62 60 68" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M80 68 C84 62 90 62 94 68" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="42" cy="86" r="8" fill="#ffc2d1" opacity=".85"/>
          <circle cx="98" cy="86" r="8" fill="#ffc2d1" opacity=".85"/>
          <path d="M62 82 C66 88 74 88 78 82" stroke="#2b2b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="q-buttons">
        <button class="btn primary" id="yesBtn">ДА</button>
        <button class="btn" id="noBtn">НЕТ</button>
      </div>
    </div>
  </div>

  <!-- Scene 4: Final -->
  <div class="scene" id="scene-final">
    <div class="final-card">
      <span class="final-emoji">💌</span>
      <div class="final-title">Хорошего дня!</div>
      <div class="final-msg" id="finalMsg">Пусть сегодняшний день будет таким же светлым, как твоя улыбка. Люблю тебя</div>
      <button class="restart" id="restartBtn">Открыть письмо ещё раз</button>
    </div>
  </div>

</div>

<script>
  const captions = {
    envelope: 'конечно... получить сообщение "доброе утро" — это мило, но вот это:',
    letter: 'Всегда рядом поддержу в любой момент',
    question: 'Самая добрая красивая моя любимая',
    final: 'Я щас сплю'
  };
  const caption = document.getElementById('caption');
  const scenes = {
    envelope: document.getElementById('scene-envelope'),
    letter: document.getElementById('scene-letter'),
    question: document.getElementById('scene-question'),
    final: document.getElementById('scene-final'),
  };

  function goTo(name){
    Object.values(scenes).forEach(s=>s.classList.remove('active'));
    scenes[name].classList.add('active');
    caption.textContent = captions[name];
  }

  document.getElementById('envelopeWrap').addEventListener('click', function(){
    this.classList.add('opened');
    setTimeout(()=>goTo('letter'), 650);
  });

  document.getElementById('helloBtn').addEventListener('click', ()=>goTo('question'));

  document.getElementById('yesBtn').addEventListener('click', ()=>{
    document.getElementById('finalMsg').textContent = 'Ура я рад,Удачи на смене сил и терпения Любовь моя 💛';
    goTo('final');
  });

  // playful dodging "NO" button
  const noBtn = document.getElementById('noBtn');
  const qButtons = document.querySelector('.q-buttons');
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    dodge();
  });
  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    dodge();
  }, {passive:false});

  function dodge(){
    const rect = qButtons.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const maxX = rect.width - btnRect.width - 20;
    const maxY = 8;
    const randX = (Math.random()-0.5) * maxX;
    const randY = (Math.random()-0.5) * maxY * 2;
    noBtn.style.transform = `translate(${randX}px, ${randY}px)`;
  }

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    document.getElementById('envelopeWrap').classList.remove('opened');
    noBtn.style.transform = 'none';
    goTo('envelope');
  });
</script>

</body>
</html>
